# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en"
tone_instructions: "Senior-level review. Prioritize FFI safety, Rust performance, and low-level correctness."
early_access: true

reviews:
  profile: "assertive"
  high_level_summary: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  estimate_code_review_effort: true
  suggested_labels: true
  auto_apply_labels: true
  suggested_reviewers: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "LLM IGNORE"

  labeling_instructions:
    # Conventional commit types.
    - label: "feat"
      instructions: "New user-facing functionality or capability added."
    - label: "fix"
      instructions: "Bug fix — corrects incorrect behavior or a regression."
    - label: "docs"
      instructions: "Documentation-only changes (README, CLAUDE.md, doc comments, etc.)."
    - label: "refactor"
      instructions: "Code restructuring with no change in external behavior."
    - label: "test"
      instructions: "Adding or updating tests only, no production code changes."
    - label: "ci"
      instructions: "Changes to CI/CD workflows, GitHub Actions, or build pipelines."
    - label: "chore"
      instructions: "Routine maintenance — dependency bumps, tooling config, formatting."
    - label: "perf"
      instructions: "Performance improvement with no functional change."
    - label: "deps"
      instructions: "Changes to build system, Cargo.toml, pubspec.yaml, or build hooks."

    # Language / scope tags.
    - label: "dart"
      instructions: "PR touches pure Dart code (frigatebird/ Dart files)."
    - label: "rust"
      instructions: "PR touches Rust code (frigatebird/rust/ directory)."
    - label: "flutter"
      instructions: "PR touches Flutter code (frigatedraw/ Dart files)."

  path_filters:
    - "!**/*.lock"
    - "!build/**"
    - "!**/target/**"
    - "!**/.dart_tool/**"
    - "!**/*.g.dart"

  path_instructions:
    - path: "frigatebird/rust/src/**/*.rs"
      instructions: >
        Review Rust code with extra care for idiomatic patterns and safety:

        - All public FFI functions MUST be `#[unsafe(no_mangle)] pub unsafe extern "C"`.
        - Prefer safe Rust in internal functions; only `unsafe` at the FFI boundary.
        - `export_image` MUST wrap its body in `std::panic::catch_unwind` to prevent
          panics from crossing the FFI boundary (which is UB).
        - Return `ByteBuffer { null, 0 }` on panic, never propagate errors across FFI.
        - Use `into_boxed_slice()` + `Box::into_raw()` for returned buffers so
          capacity == len, enabling safe reconstruction in `free_bytes`.
        - Coordinates cross the FFI boundary as **pixels end-to-end** — no
          normalization step. Image width/height are NOT passed over FFI; Rust
          reads the file and uses its own decoded dimensions. (CLAUDE.md is the
          source of truth here; do not flag "normalized 0.0-1.0" wording, that
          was removed.)
        - Color format is 0xAARRGGBB (alpha high byte, blue low byte).

    - path: "frigatebird/lib/**/ffi/**/*.dart"
      instructions: >
        FFI binding layer — the most safety-critical Dart code in the project.

        - `@Native` annotations must use `@DefaultAsset('package:frigatebird/src/ffi/bindings.dart')`.
        - FFI struct field order MUST match the Rust `#[repr(C)]` definition exactly.
        - Use `Size` (not `IntPtr`) for buffer lengths — maps to C `size_t` / Rust `usize`.
        - Mark trivial FFI functions with `isLeaf: true` only if they never call back into Dart.
        - No `dart:ffi` or `dart:io` imports in shared (non-conditional-import) files.
        - Conditional imports pattern: `dart.library.ffi` for native, `dart.library.js_interop` for web.
        - Caller MUST free Rust-allocated buffers via `free_bytes`. Check for null before use.
        - Export runs in `Isolate.run()` — pass `int address` across isolates, not Pointer.

    - path: "frigatebird/lib/src/**/*.dart"
      instructions: >
        Pure Dart domain models and commands (no Flutter dependency). These cross the FFI boundary.

        - All coordinates are in document space (image pixels), never screen space.
        - Prefer these types: int, double, bool, String, Pointer, Float32x4, Float64x2, Int32x4.
        - FfiColor stores 0xAARRGGBB as a single int.
        - Command pattern: snapshot on drag start, commit on drag end.

    - path: "frigatedraw/lib/src/ui/**/*.dart"
      instructions: >
        Flutter UI layer — widgets and painters.

        - InteractiveViewer handles zoom/pan — do NOT reimplement pinch-to-zoom.
        - Use `Listener` wrapping `InteractiveViewer` (not GestureDetector) to avoid gesture arena conflicts.
        - `panEnabled: !isDragging` to disable canvas pan while dragging an element.
        - All positions in document space; use `TransformationController.toScene()` for screen-to-document.
        - Use `getMaxScaleOnAxis()` for scale-aware deltas.
        - Minimum rect size: 10x10 pixels enforced during resize.

    - path: "frigatebird/hook/build.dart"
      instructions: >
        Dart build hook that invokes RustBuilder from native_toolchain_rust.
        This runs automatically during `flutter build`/`flutter run`.
        Ensure assetName matches the @DefaultAsset path in bindings.dart.
        Ensure cratePath points to the `rust/` directory.

    - path: ".github/workflows/*.yaml"
      instructions: >
        GitHub Actions CI workflows. This project has multiple separate workflows:
        dart_check.yaml (pure Dart analysis and tests for frigatebird/),
        flutter_check.yaml (Flutter analysis and tests for frigatedraw/),
        rust_check.yaml (Cargo clippy, fmt, test, coverage in frigatebird/rust/).
        Workflow files live directly in .github/workflows/ (not .github/).
        Check that path triggers match the corresponding source directories.

    - path: "**/*.{dart,rs}"
      instructions: >
        **Project conventions - do NOT re-litigate.** These decisions have been
        made; flagging them as issues adds noise without value.

        Deliberate design choices (accept, don't suggest changes):

        - **assert + clamp** is the house pattern for stylistic params
          (`imageQuality`, `fontSize`, etc.): debug builds assert a sane range,
          release builds silently clamp. Do NOT suggest throwing
          `RangeError`/`ArgumentError` for these - a stylistic param should not
          raise a typed exception just because someone passed `150` instead of
          `100`.

        - `IoError` in `rust/src/io.rs` uses **unit variants by design**.
          Rationale is in the module header comment (lines 6-8). Context-bearing
          variants (`IoError::Decode(image::ImageError)` etc.) only make sense
          together with a PR that also surfaces those details through the FFI
          `i32` boundary - don't suggest the enum change in isolation.

        - `NativeImage.fromBytes` is a **single-purpose factory** for encoded
          image bytes (PNG/JPEG). Do not suggest splitting it into
          `fromEncodedBytes` / `fromRawRgba` - there's one caller, encoded
          bytes. Misuse surfaces loudly as an `ImageDecodeException` from the
          Rust side, not silently. YAGNI applies; split when a second use case
          actually lands.

        - `RenderException.fromCode` is only invoked on `code != 0` (see
          `render_image.dart` - `if (code != 0) throw fromCode(code)`). Do NOT
          suggest changing the return type to nullable "to handle success" - 0
          never reaches the function.

        - `isLeaf: true` on `@Native` annotations means **"won't call back into
          Dart"**, not "must be fast." `render_image` does heavy work but runs
          in `Isolate.run()`; `isLeaf: true` is correct.

        - The Rust `rotate_about` function deliberately runs trig + bilinear
          math in `f64` despite the `f32` public signature. This is for
          cross-platform libm portability (glibc x86_64 / glibc arm64 / Apple
          libm disagree on `f32::cos`). Don't suggest "unify to f32" or
          "why f64 for an f32 API?" - the comment above the function explains
          why.

        - `DrawPainter.paint`'s `TextElement` branch is an **explicit TODO**
          (see comment in `draw_painter.dart`). Don't flag "TextElement renders
          as a no-op" - that's the intended state until the painter is wired up
          in a follow-up PR.


        Anti-nitpick rules:

        - Do NOT suggest arbitrary allocation ceilings like
          `assert(length * sizeOf<T>() < (1 << 30))`. Dart `int` is 64-bit on
          native; there is no multiplication overflow at realistic sizes, and
          real OOM is handled by the platform allocator. Propose such a guard
          only with evidence of a concrete overflow, not speculatively.

        - Do NOT suggest collapsing comments into `expect(reason:)` strings or
          vice versa - the project's test style is explicit: `reason:` strings
          on `expect()` for non-obvious failure modes, no explanatory comments
          around `expect` calls, fat-arrow body for single-`expect` tests.

        - Do NOT suggest error `.source` chains on Dart `RenderException`
          subtypes without also proposing how the source reaches Dart through
          the FFI `i32` boundary. The hierarchy is intentionally slim until
          structured diagnostics plumbing lands.

        - Do NOT suggest splitting files that currently hold a
          `sealed class` + its concrete subclasses. The sealed-parent
          organization is deliberate (exhaustive `switch` + colocated
          documentation); DCM's `prefer-single-declaration-per-file` is
          already excluded for this case in `analysis_options.yaml`.

        - Do NOT suggest `UnmodifiableListView` wrapping for private internal
          state that already flows into deeply-immutable sinks (`Isolate.run`
          argument, for instance). The `@pragma('vm:deeply-immutable')` on the
          element types already gives the zero-copy / no-mutation guarantee.

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: >
        PR title MUST follow Conventional Commits format:
        `type(optional-scope): description`. Allowed types: feat, fix, docs,
        refactor, test, ci, chore, perf, deps. Scope is optional but if present
        should be: dart, rust, flutter, ffi, ui, or build. Title should be
        lowercase after the colon, max ~72 characters total.
    description:
      mode: "warning"
    docstrings:
      mode: "off"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: true

  slop_detection:
    enabled: true

  tools:
    # Relevant to this project.
    clippy:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true

    # Not used in this project.
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    golangci-lint:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    rubocop:
      enabled: false
    brakeman:
      enabled: false
    pmd:
      enabled: false
    detekt:
      enabled: false
    hadolint:
      enabled: false
    checkov:
      enabled: false
    tflint:
      enabled: false
    trivy:
      enabled: false
    circleci:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    sqlfluff:
      enabled: false
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    fortitudeLint:
      enabled: false
    prismaLint:
      enabled: false
    swiftlint:
      enabled: false
    luacheck:
      enabled: false
    dotenvLint:
      enabled: false
    htmlhint:
      enabled: false
    stylelint:
      enabled: false
    checkmake:
      enabled: false
    blinter:
      enabled: false
    smartyLint:
      enabled: false
    emberTemplateLint:
      enabled: false
    psscriptanalyzer:
      enabled: false
    shopifyThemeCheck:
      enabled: false

chat:
  art: false
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"

code_generation:
  docstrings:
    language: "en-US"
    path_instructions:
      - path: "frigatebird/rust/src/**/*.rs"
        instructions: >
          Use `///` doc comments (not `//!`). Include a `# Safety` section for
          any unsafe function. Explain what the function does in terms a Rust
          beginner would understand. Mention the Dart-side caller when relevant.
      - path: "frigatebird/lib/**/*.dart"
        instructions: >
          Use `///` dartdoc comments. For FFI bindings, document the memory
          contract (who allocates, who frees). For public API, include a brief
          example where useful. Reference the corresponding Rust function name
          for FFI wrappers.
      - path: "frigatedraw/lib/**/*.dart"
        instructions: >
          Use `///` dartdoc comments. For Flutter widgets, document the key
          parameters and behavior. Reference frigatebird types when they appear
          in the public API.
  unit_tests:
    path_instructions:
      - path: "frigatebird/rust/src/**/*.rs"
        instructions: >
          Place tests in a `#[cfg(test)] mod tests` block at the bottom of
          the file. Use the tiny_png() helper for test images. Test both
          success and error paths (corrupt input -> panic -> null ByteBuffer).
          Assert on JPEG SOI marker bytes [0xFF, 0xD8] for output validation.
      - path: "frigatebird/lib/src/**/*.dart"
        instructions: >
          Use `package:test/test.dart` (not flutter_test). Tests go in
          frigatebird/test/ mirroring lib/src/ structure. Use `group()` with
          the class type as the description. Test copyWith preserves unchanged
          fields. Test immutability (original unchanged after copy).
      - path: "frigatedraw/lib/src/**/*.dart"
        instructions: >
          Use `package:flutter_test/flutter_test.dart`. Tests go in
          frigatedraw/test/ mirroring lib/src/ structure. For widget tests,
          use testWidgets. For controller/logic tests, regular test() is fine.

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
