name: 🐦 Flutter Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter_check.yaml"
      - "frigatedraw/**/*.dart"
      - "frigatedraw/pubspec.yaml"
  pull_request:
    paths:
      - ".github/workflows/flutter_check.yaml"
      - "frigatedraw/**/*.dart"
      - "frigatedraw/pubspec.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: 🐦 Flutter Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frigatedraw

    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@v6.0.2

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🕵️ Analyze code
        uses: ValentinVignal/action-dart-analyze@v2.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fail-on: note
          fail-on-format: true
          format: true
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: frigatedraw

      - name: 🏜️ Publish dry-run
        if: false # TODO(tsinis) before publish change to ${{ github.event_name == 'pull_request' }}
        run: dart pub publish --dry-run

      - name: 🧮 Check PANA score
        if: false # TODO(tsinis) before publish change to ${{ github.event_name == 'pull_request' }}
        run: |
          sudo apt-get install -y webp
          dart pub global activate pana
          dart pub global run pana . --no-warning --exit-code-threshold 0 --flutter-sdk $FLUTTER_ROOT

      - name: 🛂 Fix file system permissions
        run: sudo chown -R runner:runner $(pwd) && sudo chmod -R 777 $(pwd)

      - name: 🔬 Run Flutter tests with coverage
        run: NIX_FRIGATE_DEBUG_FFI=true flutter test --coverage --no-pub

      - name: 💯 Upload to Codecov
        uses: codecov/codecov-action@v6.0.0
        with:
          fail_ci_if_error: true
          files: frigatedraw/coverage/lcov.info
          flags: flutter
          name: flutter
          override_branch: ${{ github.base_ref }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
