name: 🦀 Rust Check

on:
  push:
    branches: [main]
    paths:
      - "rust/**/**.rs"
  pull_request:
    paths:
      - "rust/**/**.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: 🦀 Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust

    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@v6.0.2

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: 🗃️ Cache Cargo registry
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 📦 Check Cargo dependencies
        run: cargo fetch

      - name: 🎨 Check formatting
        run: cargo fmt --all -- --check

      - name: 🔬 Run Clippy (lints)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🏗️ Build
        run: cargo build --all-features

      - name: 🧪 Run tests
        run: cargo test --all-features

      - name: 📥 Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 🧮 Generate coverage report # TODO(tsinis) - adjust min coverage.
        run: cargo llvm-cov --all-features --lcov --output-path ../coverage/lcov.info

      - name: 💯 Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage/lcov.info
          flags: rust
          name: rust
          override_branch: ${{ github.base_ref }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
