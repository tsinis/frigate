name: 🦀 Rust Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust_check.yaml"
      - "rust/**/**.rs"
      - "rust/*.toml"
  pull_request:
    paths:
      - ".github/workflows/rust_check.yaml"
      - "rust/**/**.rs"
      - "rust/*.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: 🦀 Rust Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@v6.0.2

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: 🗃️ Cache Cargo registry
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: 📦 Check Cargo dependencies
        run: cargo fetch

      - name: 🎨 Check formatting
        run: cargo fmt --all -- --check

      - name: 🔬 Run Clippy (lints)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🏗️ Build
        run: cargo build --all-features

      - name: 🧪 Run tests
        run: cargo test --all-features

      - name: 📥 Install cargo-llvm-cov
        if: ${{ matrix.runner == 'ubuntu-latest' }}
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 🧮 Generate coverage report # TODO(tsinis) - adjust min coverage.
        if: ${{ matrix.runner == 'ubuntu-latest' }}
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: 💯 Upload to Codecov
        if: ${{ matrix.runner == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v6.0.0
        with:
          fail_ci_if_error: true
          working-directory: rust
          files: lcov.info
          flags: rust-${{ runner.arch }}
          name: rust-${{ runner.arch }}
          override_branch: ${{ github.base_ref }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
