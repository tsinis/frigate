name: 🦀 Rust Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust_check.yaml"
      - "frigatebird/rust/**/*.toml"
      - "frigatebird/rust/**"
  pull_request:
    paths:
      - ".github/workflows/rust_check.yaml"
      - "frigatebird/rust/**/*.toml"
      - "frigatebird/rust/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: 🦀 Rust Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frigatebird/rust
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@v6.0.2

      - name: 🛠️ Install Rust components (pinned nightly)
        run: |
          # Install stable for base tasks (fmt, audit, deny, trust)
          rustup toolchain install stable --profile minimal --component rustfmt
          # Install pinned nightly for dev checks (clippy, test, miri, asan, fuzz, etc.)
          # Note: Keep this date in sync with frigatebird/rust/Makefile.toml [env] NIGHTLY
          rustup toolchain install nightly-2026-05-02 --profile minimal --component miri --component clippy --component rustfmt
          # Set stable as default
          rustup default stable

      - name: 🦀 Rust version
        run: rustc --version && cargo --version

      - name: 📥 Install cargo-make and tools
        uses: taiki-e/install-action@v2.75.28
        with:
          tool: cargo-make,nextest,cargo-deny,cargo-audit,cargo-semver-checks,cargo-udeps,cargo-llvm-lines,cargo-bloat,cargo-fuzz,cargo-trust

      - name: 📥 Install cargo-llvm-cov
        if: matrix.runner == 'ubuntu-latest'
        uses: taiki-e/install-action@v2.75.28
        with:
          tool: cargo-llvm-cov

      - name: 🗃️ Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            frigatebird/rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('frigatebird/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: 📦 Check Cargo dependencies
        run: cargo fetch

      - name: 🛡️ Run Optimization Strict Checks
        # We skip mutants in check-all in CI to stay under timeout.
        # miri and fuzz are now part of check-all but gated by Makefile logic.
        run: cargo make check-all

      - name: 📤 Upload to Codecov
        if: matrix.runner == 'ubuntu-latest'
        uses: codecov/codecov-action@v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frigatebird/rust/lcov.info
          fail_ci_if_error: true
