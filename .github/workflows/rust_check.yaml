name: 🦀 Rust Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust_check.yaml"
      - "frigatebird/rust/**/**.rs"
      - "frigatebird/rust/*.toml"
  pull_request:
    paths:
      - ".github/workflows/rust_check.yaml"
      - "frigatebird/rust/**/**.rs"
      - "frigatebird/rust/*.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: 🦀 Rust Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frigatebird/rust
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@v6.0.2

      - name: 🛠️ Install Rust components
        run: |
          # Install nightly toolchain
          rustup toolchain install nightly
          # Add required components to nightly
          rustup component add --toolchain nightly miri clippy rustfmt
          # Add basic components to stable as well
          rustup component add rustfmt clippy

      - name: 📥 Install cargo-make and tools
        uses: taiki-e/install-action@v2.75.28
        with:
          tool: >
            cargo-make,
            nextest,
            cargo-deny,
            cargo-audit,
            cargo-semver-checks,
            cargo-udeps,
            cargo-hack,
            cargo-llvm-lines,
            cargo-expand,
            cargo-trust,
            cargo-fuzz,
            cargo-call-stack,
            cargo-bloat

      - name: 🗃️ Cache Cargo registry
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            frigatebird/rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('frigatebird/rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: 📦 Check Cargo dependencies
        run: cargo fetch

      - name: 🛡️ Run All Strict Checks
        run: cargo make check-all
