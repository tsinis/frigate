[package]
name = "frigate"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ffi_helpers = "0.3" # TODO: Consider removal, not updated for years.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2.32"
# Drop tiny-skia's `png-format` feature — we use `image` for PNG/JPEG decode and encode, so
# pulling tiny-skia's parallel PNG stack would just bloat the binary. Keep `simd` for the
# SIMD-accelerated rasterizer paths (the main perf win on x86 / aarch64).
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
