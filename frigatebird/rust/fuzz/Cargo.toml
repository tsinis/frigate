[package]
name = "frigate-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
frigate = { path = "..", features = ["fuzzing"] }
arbitrary = { version = "1.4.1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
safer-ffi = { version = "0.2.0-rc1" }

[[bin]]
name = "ffi_boundary"
path = "fuzz_targets/ffi_boundary.rs"
test = false
doc = false

[[bin]]
name = "draw_elements"
path = "fuzz_targets/draw_elements.rs"
test = false
doc = false
