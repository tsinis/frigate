# Nightly toolchain (pinned) is used ONLY for strict developer checks.
# End users and release builds use stable Rust.

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.test]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["nextest", "run", "--all-features"]

[tasks.golden]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["test", "--test", "rect_golden", "--test", "text_golden"]

[tasks.deny]
command = "cargo"
args = ["deny", "check"]

[tasks.audit]
command = "cargo"
args = [
    "audit",
    "--ignore", "RUSTSEC-2025-0140",
    "--ignore", "RUSTSEC-2025-0021",
    "--ignore", "RUSTSEC-2021-0145",
    "--ignore", "RUSTSEC-2024-0375",
    "--ignore", "RUSTSEC-2024-0436",
    "--ignore", "RUSTSEC-2025-0119",
]

[tasks.miri]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["miri", "test", "--lib", "--", "--skip", "io::tests"]

[tasks.semver]
# semver-checks is non-blocking until the first release is published to crates.io.
ignore_errors = true
command = "cargo"
args = ["semver-checks", "check-release"]

[tasks.udeps]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["udeps", "--all-targets"]

[tasks.mutants]
toolchain = "nightly-2026-05-02"
ignore_errors = true
command = "cargo"
args = ["mutants"]

[tasks.hack]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["hack", "test", "--feature-powerset"]

[tasks.llvm-lines]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["llvm-lines", "--release"]

[tasks.expand]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["expand"]

[tasks.trust]
command = "cargo"
args = ["trust"]

[tasks.install-macos-targets]
# Ensure target is installed for the specific pinned nightly used for fuzzing.
# Idempotent and safe to run.
command = "rustup"
args = ["target", "add", "--toolchain", "nightly-2026-05-02", "x86_64-apple-darwin"]

[tasks.fuzz]
toolchain = "nightly-2026-05-02"
ignore_errors = true
dependencies = ["install-macos-targets"]
command = "cargo"
args = ["fuzz", "run", "ffi_boundary", "--", "-max_total_time=60"]

[tasks.asan]
toolchain = "nightly-2026-05-02"
ignore_errors = true
command = "cargo"
args = ["test", "--all-features"]
env = { RUSTFLAGS = "-Z sanitizer=address" }

[tasks.call-stack]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["call-stack"]

[tasks.bloat]
toolchain = "nightly-2026-05-02"
command = "cargo"
args = ["bloat", "--release", "--crates"]

[tasks.check-all]
dependencies = [
    "fmt",
    "clippy",
    "test",
    "golden",
    "deny",
    "audit",
    "semver",
    "udeps",
    "llvm-lines",
    "trust",
    "asan",
    "miri",
    "install-macos-targets",
    "fuzz",
    "bloat"
]
