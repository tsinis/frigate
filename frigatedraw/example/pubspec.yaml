version: 0.0.1+0
name: frigatedraw_example
description: "Demonstrates how to use the frigatedraw package."
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  frigatedraw:
    path: ../
  meta: any # Constrained by Flutter SDK
  # Range syntax (not caret) so pub will accept stable `2.1.5` when published — caret on a
  # pre-release version pins you to the `-dev*` series only.
  path_provider_ffi: ">=2.1.5-dev2 <3.0.0"

dev_dependencies:
  dart_code_metrics_presets: any # Constrained in the workspace pubspec.yaml
  flutter_lints: any # Constrained in the parent pubspec.yaml

flutter:
  uses-material-design: true

  assets:
    - assets/sample.png
    - assets/RobotoMono.ttf
